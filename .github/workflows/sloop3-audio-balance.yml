name: SLOOP 3.4.1 audio-balance (2-inch ST7789 240x320)

on:
  push:
    branches: [sloop3-audio-balance-240x320]
    paths:
      - "sloop3_audio_balance/**"
      - ".github/workflows/sloop3-audio-balance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-audio-balance-240x320:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Obtener SLOOP 3.4.1 beta (fuente original fija)
        run: |
          git clone --depth 1 https://github.com/isod89/sloop3-fm1.git sloop3
          cd sloop3
          git fetch --depth 1 origin f48b4c8b40dc39da3a8089045a3034fdea1bfa45
          git checkout --detach f48b4c8b40dc39da3a8089045a3034fdea1bfa45
      - name: Adaptar pantalla ST7789 a 240x320
        run: |
          python3 -m py_compile sloop3_240x320/adapt_screen.py
          python3 sloop3_240x320/adapt_screen.py sloop3
          python3 sloop3_240x320/test_screen.py
      - name: Medir niveles originales SLOOP 3.4.1 (antes del cambio)
        run: |
          make -C sloop3 -j2 build/level_tool > baseline-build.log 2>&1 || { tail -100 baseline-build.log; exit 1; }
          (cd sloop3 && build/level_tool drums > ../baseline-drums.txt)
          sed -n '1,6p' baseline-drums.txt
      - name: Aplicar corrección experimental de sonido
        run: |
          python3 -m py_compile sloop3_audio_balance/fix_audio.py
          python3 sloop3_audio_balance/fix_audio.py sloop3
      - name: Pruebas generales y de volumen real de baterías/sintes en PC
        run: |
          python3 -m pip install --disable-pip-version-check numpy pillow
          make -C sloop3 -j2 test > make-test.log 2>&1 || { tail -100 make-test.log; exit 1; }
          tail -30 make-test.log
          (cd sloop3 && build/level_tool drums > ../balanced-drums.txt)
          python3 sloop3_audio_balance/test_audio_balance.py baseline-drums.txt balanced-drums.txt
          sed -n '1,6p' balanced-drums.txt
      - name: Instalar compilador pi32v2 LLVM oficial de SLOOP 3
        run: |
          curl -fL --retry 3 --retry-delay 3 -o toolchain.tar.xz \
            https://github.com/jvitkauskas/pi32v2-llvm/releases/download/pi32v2-23.1.5-2/pi32v2-llvm-23.1.5-2-linux-x64.tar.xz
          echo 'cb896562418a2be93edb9bac26af4bc81a106a32974002a78e6b9fc203c93990  toolchain.tar.xz' | sha256sum -c -
          mkdir -p sloop3/toolchain
          tar -xJf toolchain.tar.xz -C sloop3/toolchain --strip-components=1
          test -x sloop3/toolchain/bin/clang
      - name: Compilar SLOOP 3 AUDIO BALANCE para pantalla 2 pulgadas
        run: |
          cd sloop3
          EDITOR_E2E=0 INSTALLER_E2E=0 sh fw/build.sh toolchain/bin > ../sloop3-build.log 2>&1 || { tail -120 ../sloop3-build.log; exit 1; }
          tail -45 ../sloop3-build.log
          test -s build/fw/fw.area
          test -s build/fw/installer-fm1.html
          test -s build/fw/editor-sloop3.html
          sha256sum build/fw/fw.area build/fw/installer-fm1.html
      - name: Preparar paquete de prueba
        run: |
          mkdir -p entrega
          cp sloop3/build/fw/fw.area entrega/sloop3-3.4.1-240x320-AUDIO-BALANCE-EXPERIMENTAL.area
          cp sloop3/build/fw/installer-fm1.html entrega/instalador-SLOOP3-240x320-AUDIO-BALANCE-EXPERIMENTAL.html
          cp sloop3/build/fw/editor-sloop3.html entrega/editor-SLOOP3-3.4.1.html
          cp sloop3_audio_balance/LEEME.md entrega/LEEME.md
          cp balanced-drums.txt entrega/informe-volumen-balanceado.txt
          cp baseline-drums.txt entrega/informe-volumen-original.txt
      - name: Publicar paquete de prueba
        uses: actions/upload-artifact@v4
        with:
          name: SLOOP3-3.4.1-ST7789-240x320-AUDIO-BALANCE-EXPERIMENTAL
          path: entrega/
          if-no-files-found: error
